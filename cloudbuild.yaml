steps:
  # Step 0a: Run backend tests (parallel with lint — gates deployment)
  - name: 'python:3.11-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        pip install -r requirements.txt pytest --quiet
        cd backend
        python -m pytest tests/ -x -q --tb=short
        echo "All tests passed"
    waitFor: ['-']

  # Step 0b: Lint (parallel with tests — advisory only, --exit-zero never blocks)
  - name: 'python:3.11-slim'
    id: 'lint'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install flake8 --quiet
        cd backend
        flake8 --max-line-length=120 --exclude=__pycache__,migrations --count --statistics --exit-zero .
    waitFor: ['-']

  # Step 1: Build the Docker image (Dockerfile handles React build internally)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    waitFor: ['run-tests', 'lint']
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        IMAGE_URI="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}"
        LATEST_URI="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest"
        docker build -t "$$IMAGE_URI" -t "$$LATEST_URI" .

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-commit-image'
    waitFor: ['build-image']
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest-image'
    waitFor: ['build-image']
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    waitFor: ['push-commit-image', 'push-latest-image']
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        IMAGE_URI="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}"

        deploy_args=(
          run deploy "${_SERVICE_NAME}"
          --image "$$IMAGE_URI"
          --region "${_REGION}"
          --platform managed
          --cpu "${_CPU}"
          --memory "${_MEMORY}"
          --min-instances "${_MIN_INSTANCES}"
          --max-instances "${_MAX_INSTANCES}"
          --concurrency "${_CONCURRENCY}"
          --timeout "${_TIMEOUT}"
          --labels "managed-by=cloud-build,service=${_SERVICE_NAME}"
          --set-env-vars "DEBUG=False,GCP_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AMADEUS_ENV=${_AMADEUS_ENV}"
        )

        if [[ -n "${_RUNTIME_SERVICE_ACCOUNT}" ]]; then
          deploy_args+=(--service-account "${_RUNTIME_SERVICE_ACCOUNT}")
        fi

        if [[ -n "${_CLOUDSQL_INSTANCE}" ]]; then
          deploy_args+=(--add-cloudsql-instances "${_CLOUDSQL_INSTANCE}")
        fi

        if [[ -n "${_VPC_CONNECTOR}" ]]; then
          deploy_args+=(--vpc-connector "${_VPC_CONNECTOR}" --vpc-egress private-ranges-only)
        fi

        if [[ "${_ALLOW_UNAUTHENTICATED}" == "true" ]]; then
          deploy_args+=(--allow-unauthenticated)
        else
          deploy_args+=(--no-allow-unauthenticated)
        fi

        gcloud "${deploy_args[@]}"

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:latest'

substitutions:
  _SERVICE_NAME: 'travelsync-pro'
  _REGION: 'asia-south1'
  _AR_REPOSITORY: 'travelsync'
  _IMAGE_NAME: 'app'
  _RUNTIME_SERVICE_ACCOUNT: ''
  _CLOUDSQL_INSTANCE: ''
  _VPC_CONNECTOR: ''
  _ALLOW_UNAUTHENTICATED: 'true'
  _CPU: '2'
  _MEMORY: '2Gi'
  _MIN_INSTANCES: '1'
  _MAX_INSTANCES: '10'
  _CONCURRENCY: '80'
  _TIMEOUT: '300'
  _AMADEUS_ENV: 'production'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
