# ─────────────────────────────────────────────────────────────────────────────
# CI — runs on every push to a dev branch and on every PR targeting main.
# Nothing deploys here. The goal is fast feedback: catch lint errors, test
# failures, and broken frontend builds BEFORE code lands on main.
#
# All three jobs (lint / test / frontend-build) run in parallel.
# A PR is blocked from merging if any job is red.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches-ignore:
      - main           # deploy.yml handles main; don't duplicate work
  pull_request:
    branches:
      - main
      - dev_v2
    types: [opened, synchronize, reopened]

# Cancel any in-progress run for the same branch/PR when a new commit is pushed.
# Saves runner minutes and keeps feedback snappy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend lint ────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install flake8
        run: pip install flake8 --quiet

      - name: Lint
        # --exit-zero → advisory; never blocks CI on style warnings.
        # Change to remove --exit-zero once the team agrees on a style baseline.
        run: |
          cd backend
          flake8 \
            --max-line-length=120 \
            --exclude=__pycache__,migrations \
            --count --statistics \
            --exit-zero \
            .

  # ── Backend tests ───────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        # pytest is not in requirements.txt (it's a dev-only dep), install it here.
        run: pip install -r requirements.txt pytest --quiet

      - name: Run tests
        # Tests use in-memory SQLite via conftest.py — no DB, no API keys needed.
        run: |
          cd backend
          python -m pytest tests/ -x -q --tb=short

  # ── Frontend build check ────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        # npm ci requires package-lock.json to be committed to the repo.
        run: |
          cd frontend
          npm ci
          npm run build
